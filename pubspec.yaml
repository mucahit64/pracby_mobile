name: pracby_mobile
description: "Pracby - Turkish exam prep platform (KPSS focus, Duolingo-style micro-learning)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.5.0
  flutter_card_swiper: ^7.0.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  flutter_html: ^3.0.0-beta.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  very_good_analysis: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  image_path: "assets/brand/p-icon.png"
  android: true
  adaptive_icon_background: "#7c3aed"
  adaptive_icon_foreground: "assets/brand/p-icon-foreground.png"
  adaptive_icon_monochrome: "assets/brand/p-icon-foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#7c3aed"
